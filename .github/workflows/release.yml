  build-wheels-macos:
    name: Build wheels (macOS aarch64)
    runs-on: macos-latest
    steps:
      - name: Checkout private repo
        uses: actions/checkout@v4
        with:
          repository: Yvictor/rshioaji
          ref: ${{ inputs.version }}
          ssh-key: ${{ secrets.PRIVATE_REPO_DEPLOY_KEY }}
          path: rshioaji

      - name: Checkout rsolace
        uses: actions/checkout@v4
        with:
          repository: Yvictor/rsolace
          ref: v0.3.11
          path: rsolace

      - name: Install pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 9

      - name: Install Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Build dashboard
        working-directory: rshioaji/dashboard
        run: pnpm install && pnpm build

      - name: Build standalone binary
        working-directory: rshioaji
        env:
          RUSTFLAGS: -Awarnings
        run: cargo build --release

      - name: Copy binary to wheel data
        run: |
          mkdir -p rshioaji/python/shioaji.data/scripts
          cp rshioaji/target/release/shioaji rshioaji/python/shioaji.data/scripts/

      - name: Install uv
        uses: astral-sh/setup-uv@v4

      - name: Build wheels
        working-directory: rshioaji/python
        env:
          CARGO_TARGET_DIR: ${{ github.workspace }}/rshioaji/target
        run: uvx --python 3.12 --from maturin maturin build --release --out dist

      - name: Upload wheel artifacts
        uses: actions/upload-artifact@v4
        with:
          name: wheel-macos-aarch64
          path: rshioaji/python/dist/*.whl

      - name: Build free-threaded wheels
        working-directory: rshioaji/python
        env:
          CARGO_TARGET_DIR: ${{ github.workspace }}/rshioaji/target
        run: |
          rm -rf dist
          uvx --python 3.14t --from maturin maturin build --release --out dist -i python3.14t --no-default-features

      - name: Upload free-threaded wheel artifacts
        uses: actions/upload-artifact@v4
        with:
          name: wheel-free-threaded-macos-aarch64
          path: rshioaji/python/dist/*.whl

      - name: Archive standalone binary
        run: |
          cd rshioaji/target/release
          tar czf ../../../shioaji-${{ inputs.version }}-macOS-aarch64.tar.gz shioaji

      - name: Upload binary artifact
        uses: actions/upload-artifact@v4
        with:
          name: binary-macos-aarch64
          path: shioaji-*.tar.gz

  build-wheels-windows:
    name: Build wheels (Windows x86_64)
    runs-on: windows-latest
    steps:
      - name: Checkout private repo
        uses: actions/checkout@v4
        with:
          repository: Yvictor/rshioaji
          ref: ${{ inputs.version }}
          ssh-key: ${{ secrets.PRIVATE_REPO_DEPLOY_KEY }}
          path: rshioaji

      - name: Checkout rsolace
        uses: actions/checkout@v4
        with:
          repository: Yvictor/rsolace
          ref: v0.3.11
          path: rsolace

      - name: Install pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 9

      - name: Install Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Build dashboard
        working-directory: rshioaji/dashboard
        run: pnpm install && pnpm build

      - name: Setup Clang
        uses: egor-tensin/setup-clang@v1
        with:
          version: latest

      - name: Setup MSVC
        uses: ilammy/msvc-dev-cmd@v1

      - name: Build standalone binary
        working-directory: rshioaji
        env:
          RUSTFLAGS: -Awarnings
          # Windows MSVC linker crashes with lto=fat (STATUS_ACCESS_VIOLATION)
          # lto=thin also crashes. Only lto=false works.
          # Root cause was kanal 9a4b98d (0.2.0-beta1). Rolled back to dc47624 (0.1.1).
          # Keep lto=fat (from Cargo.toml profile.release) — works with old kanal.
        run: cargo build --release

      - name: Copy binary to wheel data
        shell: bash
        run: |
          mkdir -p rshioaji/python/shioaji.data/scripts
          cp rshioaji/target/release/shioaji.exe rshioaji/python/shioaji.data/scripts/

      - name: Install uv
        uses: astral-sh/setup-uv@v4

      - name: Build wheels
        working-directory: rshioaji/python
        env:
          CARGO_TARGET_DIR: ${{ github.workspace }}/rshioaji/target
        run: uvx --python 3.12 --from maturin maturin build --release --out dist

      - name: Upload wheel artifacts
        uses: actions/upload-artifact@v4
        with:
          name: wheel-windows-x86_64
          path: rshioaji/python/dist/*.whl

      # Windows free-threaded: needs PyO3 generate-import-lib feature
      # - name: Build free-threaded wheels
      #   working-directory: rshioaji\python
      #   env:
      #     CARGO_TARGET_DIR: ${{ github.workspace }}\rshioaji\target
      #   shell: pwsh
      #   run: |
      #     if (Test-Path dist) { Remove-Item -Recurse -Force dist }
      #     uvx --python 3.14t --from maturin maturin build --release --out dist -i python3.14t --no-default-features
      # - name: Upload free-threaded wheel artifacts
      #   uses: actions/upload-artifact@v4
      #   with:
      #     name: wheel-free-threaded-windows-x86_64
      #     path: rshioaji/python/dist/*.whl

      - name: Archive standalone binary
        shell: powershell
        run: |
          Compress-Archive -Path rshioaji/target/release/shioaji.exe -DestinationPath shioaji-${{ inputs.version }}-Windows-x86_64.zip

      - name: Upload binary artifact
        uses: actions/upload-artifact@v4
        with:
          name: binary-windows-x86_64
          path: shioaji-*.zip

  # build-wheels-free-threaded:
  #   TODO: add free-threaded Python 3.14t builds

  publish-pypi:
    name: Publish to PyPI
    needs: [build-wheels-linux, build-wheels-macos, build-wheels-windows]
    runs-on: ubuntu-latest
    environment:
      name: pypi
      url: https://pypi.org/project/rshioaji/
    permissions:
      id-token: write
    steps:
      - name: Download wheel artifacts
        uses: actions/download-artifact@v4
        with:
          pattern: wheel-*
          merge-multiple: true
          path: dist/

      - name: Publish to PyPI
        uses: pypa/gh-action-pypi-publish@release/v1

  github-release:
    name: Create GitHub Release
    needs: [build-wheels-linux, build-wheels-macos, build-wheels-windows]
    runs-on: ubuntu-latest
    steps:
      - name: Checkout sinotrade/rshioaji
        uses: actions/checkout@v4

      - name: Download all artifacts
        uses: actions/download-artifact@v4
        with:
          path: artifacts/

      - name: Organize release assets
        run: |
          mkdir -p release
          find artifacts -name '*.whl' -exec cp {} release/ \;
          find artifacts -name '*.tar.gz' -exec cp {} release/ \;
          find artifacts -name '*.zip' -exec cp {} release/ \;
          cp install.sh release/
          cp install.ps1 release/

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ inputs.version }}
          name: ${{ inputs.title || inputs.version }}
          body: ${{ inputs.release_notes }}
          prerelease: ${{ inputs.prerelease == 'true' }}
          files: release/*
