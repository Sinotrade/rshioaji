name: Release

on:
  workflow_dispatch:
    inputs:
      version:
        description: 'Release version (e.g., v1.5.0b1)'
        required: true
      release_notes:
        description: 'Release notes'
        required: false
        default: ''
      prerelease:
        description: 'Is this a prerelease?'
        required: false
        default: 'false'

permissions:
  contents: write
  id-token: write

jobs:
  build-wheels-linux:
    name: Build wheels (Linux x86_64)
    runs-on: ubuntu-latest
    steps:
      - name: Checkout private repo
        uses: actions/checkout@v4
        with:
          repository: Yvictor/rshioaji
          ref: ${{ inputs.version }}
          ssh-key: ${{ secrets.PRIVATE_REPO_DEPLOY_KEY }}
          path: rshioaji

      - name: Checkout rsolace
        uses: actions/checkout@v4
        with:
          repository: Yvictor/rsolace
          path: rsolace

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Setup Rust
        uses: actions-rust-lang/setup-rust-toolchain@v1
        with:
          toolchain: stable

      - name: Install LLVM and Clang
        uses: KyleMayes/install-llvm-action@v2
        with:
          version: "10.0"

      - name: Build standalone binary
        working-directory: rshioaji
        run: cargo build --release

      - name: Copy binary to wheel data
        run: |
          mkdir -p rshioaji/python/shioaji.data/scripts
          cp rshioaji/target/release/shioaji rshioaji/python/shioaji.data/scripts/

      - name: Install maturin with zig
        run: pip install maturin[zig]

      - name: Build wheels
        working-directory: rshioaji/python
        env:
          CARGO_TARGET_DIR: ${{ github.workspace }}/rshioaji/target
        run: maturin build --release --out dist --find-interpreter --compatibility manylinux2014 --zig

      - name: Upload wheel artifacts
        uses: actions/upload-artifact@v4
        with:
          name: wheel-linux-x86_64
          path: rshioaji/python/dist/*.whl

      - name: Archive standalone binary
        run: |
          cd rshioaji/target/release
          tar czf ../../../shioaji-${{ inputs.version }}-Linux-x86_64.tar.gz shioaji

      - name: Upload binary artifact
        uses: actions/upload-artifact@v4
        with:
          name: binary-linux-x86_64
          path: shioaji-*.tar.gz

