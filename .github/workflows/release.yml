name: Release

on:
  workflow_dispatch:
    inputs:
      version:
        description: 'Release version (e.g., v1.5.0b2)'
        required: true
      title:
        description: 'Release title'
        required: false
        default: ''
      release_notes:
        description: 'Release notes'
        required: false
        default: ''
      prerelease:
        description: 'Is this a prerelease?'
        required: false
        default: 'false'

permissions:
  contents: write
  id-token: write

jobs:
  build-wheels-linux:
    name: Build wheels (Linux x86_64)
    runs-on: ubuntu-latest
    steps:
      - name: Checkout private repo
        uses: actions/checkout@v4
        with:
          repository: Yvictor/rshioaji
          ref: ${{ inputs.version }}
          ssh-key: ${{ secrets.PRIVATE_REPO_DEPLOY_KEY }}
          path: rshioaji

      - name: Checkout rsolace
        uses: actions/checkout@v4
        with:
          repository: Yvictor/rsolace
          ref: v0.3.11
          path: rsolace

      - name: Setup Rust
        uses: actions-rust-lang/setup-rust-toolchain@v1
        with:
          toolchain: stable

      - name: Install pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 9

      - name: Install Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Build dashboard
        working-directory: rshioaji/dashboard
        run: pnpm install && pnpm build

      - name: Install LLVM and Clang
        uses: KyleMayes/install-llvm-action@v2
        with:
          version: "10.0"

      - name: Build standalone binary
        working-directory: rshioaji
        env:
          RUSTFLAGS: -Awarnings
        run: cargo build --release

      - name: Copy binary to wheel data
        run: |
          mkdir -p rshioaji/python/shioaji.data/scripts
          cp rshioaji/target/release/shioaji rshioaji/python/shioaji.data/scripts/

      - name: Install uv
        uses: astral-sh/setup-uv@v4

      - name: Build wheels
        working-directory: rshioaji/python
        env:
          RUSTFLAGS: -Awarnings
        # zig required for manylinux2014 (native glibc too new). no cache sharing with cargo build.
        run: |
          mkdir -p shioaji.data/scripts
          uvx --python 3.12 --from 'maturin[zig]' maturin build --release --out dist --compatibility manylinux2014 --zig

      - name: Upload wheel artifacts
        uses: actions/upload-artifact@v4
        with:
          name: wheel-linux-x86_64
          path: rshioaji/python/dist/*.whl

      - name: Build free-threaded wheels
        working-directory: rshioaji/python
        env:
          RUSTFLAGS: -Awarnings
        run: |
          rm -rf dist
          uvx --python 3.14t --from 'maturin[zig]' maturin build --release --out dist -i python3.14t --no-default-features --compatibility manylinux2014 --zig

      - name: Upload free-threaded wheel artifacts
        uses: actions/upload-artifact@v4
        with:
          name: wheel-free-threaded-linux-x86_64
          path: rshioaji/python/dist/*.whl

      - name: Archive standalone binary
        run: |
          cd rshioaji/target/release
          tar czf ../../../shioaji-${{ inputs.version }}-Linux-x86_64.tar.gz shioaji

      - name: Upload binary artifact
        uses: actions/upload-artifact@v4
        with:
          name: binary-linux-x86_64
          path: shioaji-*.tar.gz

