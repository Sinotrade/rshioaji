name: CI

on:
  workflow_dispatch:
    inputs:
      ref:
        description: 'Git commit SHA to checkout'
        required: true
      branch:
        description: 'Branch name'
        required: true

jobs:
  rust-checks:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout private repo
        uses: actions/checkout@v5
        with:
          repository: Yvictor/rshioaji
          ref: refs/heads/${{ inputs.branch }}
          ssh-key: ${{ secrets.PRIVATE_REPO_DEPLOY_KEY }}
          path: rshioaji

      - name: Verify commit SHA
        working-directory: rshioaji
        run: |
          actual_sha=$(git rev-parse HEAD)
          expected_full=$(git rev-parse ${{ inputs.ref }})
          if [ "$actual_sha" != "$expected_full" ]; then
            echo "::warning::Expected SHA ${{ inputs.ref }}, got $actual_sha (branch may have advanced)"
          fi

      # rsolace is now fetched via git dependency in Cargo.toml (no checkout needed)
      # - name: Checkout rsolace
      #   uses: actions/checkout@v5
      #   with:
      #     repository: Yvictor/rsolace
      #     ref: v0.3.12
      #     path: rsolace

      - name: Set working directory
        run: echo "WORKDIR=${{ github.workspace }}/rshioaji" >> $GITHUB_ENV

      - name: Install pnpm
        uses: pnpm/action-setup@v5
        with:
          version: 9

      - name: Install Node.js
        uses: actions/setup-node@v6
        with:
          node-version: 22

      - name: Build dashboard
        working-directory: rshioaji/dashboard
        run: pnpm install && pnpm build

      - name: Lint dashboard
        working-directory: rshioaji/dashboard
        run: pnpm lint

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy

      - name: Rust cache
        uses: Swatinem/rust-cache@v2

      - name: Check formatting
        working-directory: rshioaji
        run: cargo fmt --check

      - name: Check formatting (python crate)
        working-directory: rshioaji/python
        run: cargo fmt --check

      - name: Clippy
        working-directory: rshioaji
        run: cargo clippy --all-targets -- -D warnings

      - name: Run tests
        working-directory: rshioaji
        run: cargo test --lib

  python-tests:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout private repo
        uses: actions/checkout@v5
        with:
          repository: Yvictor/rshioaji
          ref: refs/heads/${{ inputs.branch }}
          ssh-key: ${{ secrets.PRIVATE_REPO_DEPLOY_KEY }}
          path: rshioaji

      # rsolace is now fetched via git dependency in Cargo.toml (no checkout needed)
      # - name: Checkout rsolace
      #   uses: actions/checkout@v5
      #   with:
      #     repository: Yvictor/rsolace
      #     ref: v0.3.12
      #     path: rsolace

      - name: Install pnpm
        uses: pnpm/action-setup@v5
        with:
          version: 9

      - name: Install Node.js
        uses: actions/setup-node@v6
        with:
          node-version: 22

      - name: Build dashboard
        working-directory: rshioaji/dashboard
        run: pnpm install && pnpm build

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@stable

      - name: Rust cache
        uses: Swatinem/rust-cache@v2
        with:
          workspaces: rshioaji

      - name: Install uv
        uses: astral-sh/setup-uv@v7

      - name: Build Python binding
        working-directory: rshioaji/python
        run: mkdir -p shioaji.data/scripts && uv run --with maturin maturin develop

      - name: Run Python tests
        working-directory: rshioaji/python
        run: uv run pytest tests/unit/ -v
